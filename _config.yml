title:  MolQuantDyn@Haverford
url: https://molquantdynlab-haverfordcollege.github.io

# Default preview image used by jekyll-seo-tag when a page (or its own
# front matter) doesn't set one, e.g. for link previews on Slack, etc.
image: /img/logos/MQDLab-2.png

exclude: [bibble, README.md, Makefile, screenshot.png]

description:
  The Molecular Quantum Dynamics Lab (MolQuantDyn Lab) at Haverford College, Department of Physics and Astronomy focuses on developing and using quantum dynamics methods to study processes relevant to atmopsheric chemistry, astrophysics, combustion and catalysis.

# colorize code snippets with the pygments module
highlighter: pygments

# The path structure for blog posts.
permalink: /blog/:year/:month/:day/:title.html

# allow future posts
future: true

# Sections on the "people" page.
roles:
  - key: faculty
    name: Academic Faculty
  #- key: postdoc
  #  name: Postdoctoral Researchers
  - key: grad
    name: Doctoral Students
  #- key: msc
  #  name: Master's Students
  - key: collab
    name: Collaborators
  - key: alum
    name: Alumni
  - key: senior-thesis
    name: Senior Thesis
  - key: student-researcher
    name: Student Researcher
  #- key: research-assistant
  #  name: Research Assistants
  #- key: research-associate
  #  name: Research Associates
  #- key: intern
  #  name: Interns
  # - key: ugrad
  #   name: Undergraduate Students

# Number of news stories on the front page.
front_page_news: 8

# Number of events on the front page.
front_page_events: 3

# Base pathname for links.
base: ''

# make pages for the _projects folder
collections:
  projects:
    output: true
  past-projects:
    output: true

# Navigation bar links.
navigation:
  - title: Home
    link: /
  - title: People
    link: /people.html
  - title: Research
    link: /research.html
  - title: Publications
    link: /publications.html
  - title: Codes
    link: /software.html
#  - title: Our Testbed
#    link: https://ralt.hw.ac.uk/

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# Social
social:
    name: Steve Ndengue
    links:
      - https://github.com/stevendengue
